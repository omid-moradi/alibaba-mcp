name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_LINK_MODE: copy

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy strict on src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: mypy
        run: uv run mypy src

  tests:
    name: Tests (unit, integration, e2e — mock provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run test suite
        # Live tests are deselected: CI never depends on Alibaba.ir availability.
        run: uv run pytest -v
      - name: Run live-marker suite (offline assertions about live-mode behavior)
        run: uv run pytest -m live -v

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: pip-audit
        run: |
          uv pip install pip-audit
          uv export --format requirements-txt --no-dev --no-emit-project --no-emit-workspace -o requirements-ci.txt
          pip-audit -r requirements-ci.txt --strict

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alibaba-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
