name: MCP Inspector verification

# Verifies the server against the official MCP Inspector (CLI mode),
# including discovery and invocation of tools/resources/prompts.
# Requires Node.js (npx) — provided by the runner image.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  inspector:
    name: MCP Inspector (tools/resources/prompts over Streamable HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Start Alibaba MCP (Streamable HTTP)
        run: |
          uv run python -m alibaba_mcp --transport streamable-http --port 8000 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8000/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              && break || sleep 1
          done
      - name: Inspector — tools/list
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp --method tools/list
      - name: Inspector — resources/list
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp --method resources/list
      - name: Inspector — prompts/list
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp --method prompts/list
      - name: Inspector — tools/call (search_flights)
        run: |
          DATE=$(date -d "+1 day" +%F)
          npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp \
            --method tools/call --tool-name search_flights \
            --tool-arg origin=THR destination=MHD departure_date=$DATE
      - name: Inspector — resources/read (provider-status)
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp --method resources/read --uri alibaba://travel/provider-status
      - name: Inspector — prompts/get (flight_comparison)
        run: |
          DATE=$(date -d "+1 day" +%F)
          npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp \
            --method prompts/get --prompt-name flight_comparison \
            --prompt-args origin=IKA destination=IST departure_date=$DATE
